<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verity - Bias Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Paragone';
            src: url('ParagoneFancyAestheticSerif-lx0O0.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Paragone', serif;
            background: #1e1e1e;
            color: #e0e0e0;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            border-bottom: 1px solid #2d2d2d;
            background: #252525;
        }


        /* Hero Section */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 35vh;
            padding: 3rem 2rem;
        }

        .hero h1 {
            font-family: 'Paragone', serif;
            font-size: 4rem;
            font-weight: 400;
            color: #ffffff;
            text-align: center;
            margin-bottom: 4rem;
            letter-spacing: 2px;
        }

        /* Search Box */
        .search-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        .search-box {
            width: 100%;
            display: flex;
            gap: 0.75rem;
            align-items: center;
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            border-radius: 6px;
            padding: 0.75rem 1rem;
            transition: border-color 0.2s;
        }

        .search-box:hover {
            border-color: #4d4d4d;
        }

        .search-box:focus-within {
            border-color: #5d5d5d;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1rem;
            color: #e0e0e0;
        }

        .search-box input::placeholder {
            color: #666666;
        }

        .search-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #888888;
            font-size: 1.1rem;
            padding: 0 0.5rem;
            transition: color 0.2s;
        }

        .search-btn:hover {
            color: #e0e0e0;
        }


        /* Results Section */
        .results-section {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: none;
        }

        .results-stats {
            color: #888888;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* Result Card */
        .result-item {
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            border-radius: 6px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: border-color 0.2s;
        }

        .result-item:hover {
            border-color: #4d4d4d;
        }

        .result-domain {
            color: #888888;
            font-size: 0.85rem;
        }

        .result-title {
            color: #bb86fc;
            font-size: 1.1rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1.4;
        }

        .result-title:hover {
            color: #d9b3ff;
        }

        .result-snippet {
            color: #b0b0b0;
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 600px;
        }

        /* Bias Indicators */
        .bias-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.75rem;
            flex-wrap: wrap;
        }

        .bias-score {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.4rem 0.75rem;
            border-radius: 4px;
            background: #333333;
        }

        .bias-score.low {
            color: #4caf50;
            border: 1px solid #4caf50;
        }

        .bias-score.medium {
            color: #ffc107;
            border: 1px solid #ffc107;
        }

        .bias-score.high {
            color: #ff5252;
            border: 1px solid #ff5252;
        }

        .bias-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .bias-indicator.low {
            background: #4caf50;
        }

        .bias-indicator.medium {
            background: #ffc107;
        }

        .bias-indicator.high {
            background: #ff5252;
        }

        .bias-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .bias-tag {
            font-size: 0.75rem;
            padding: 0.3rem 0.6rem;
            border-radius: 3px;
            background: #333333;
            color: #b0b0b0;
            border: 1px solid #4d4d4d;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #888888;
            display: block;
        }

        .empty-state p {
            font-size: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .navbar {
                padding: 0.75rem 1rem;
            }

            .search-container {
                padding: 0 1rem;
            }

            .results-section {
                padding: 0 1rem;
            }
        }

        /* Loading */
        .loading-dots {
            display: inline-flex;
            gap: 0.3rem;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #888888;
            animation: bounce 1.4s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                opacity: 0.3;
            }
            30% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
    </nav>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Verity</h1>
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search unbiasedly...">
                <button class="search-btn" id="searchBtn">🔍</button>
            </div>
        </div>
    </div>

    <!-- Results Section -->
    <div class="results-section" id="resultsSection">
        <div class="results-stats" id="resultsStats"></div>
        <div class="results-list" id="resultsList"></div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
        <p>Search anything to detect biases across multiple categories</p>
    </div>

    <script>
        const sampleResults = [
            {
                domain: "sciencenews.com",
                title: "New Study: Electric Vehicles May Have Hidden Climate Costs",
                snippet: "Researchers examine the environmental impact of EV manufacturing. The study finds that while EVs are cleaner over their lifetime, production impacts are significant.",
                overallScore: 6,
                severity: "medium",
                biases: ["Climate Bias", "Scientific", "Emotional"]
            },
            {
                domain: "reuters.com",
                title: "Understanding Global Temperature Trends: What Science Shows",
                snippet: "A comprehensive review of peer-reviewed research confirms that global temperatures are rising due to human activities. Major scientific organizations worldwide agree.",
                overallScore: 2,
                severity: "low",
                biases: ["Scientific"]
            },
            {
                domain: "tech-watch.io",
                title: "Tesla's CEO Sparks Controversy With Latest Social Media Posts",
                snippet: "The CEO of the electric vehicle company continues to generate debate with provocative statements. Critics point to a pattern affecting company reputation.",
                overallScore: 5,
                severity: "medium",
                biases: ["Corporate", "Emotional"]
            },
            {
                domain: "politicalanalysis.com",
                title: "Democrats' Climate Plan Branded 'Job Killer' by Opposition",
                snippet: "A new environmental policy proposal faces intense partisan criticism. One political party characterizes the plan as economically destructive.",
                overallScore: 7,
                severity: "high",
                biases: ["Political", "Emotional", "Confirmation Bias"]
            }
        ];

        function createResultCard(result) {
            const biasClass = result.severity;
            const biasesList = result.biases.map(b => `<span class="bias-tag">${b}</span>`).join('');

            return `
                <div class="result-item">
                    <div class="result-domain">${result.domain}</div>
                    <a class="result-title">${result.title}</a>
                    <div class="result-snippet">${result.snippet}</div>
                    <div class="bias-container">
                        <div class="bias-score ${biasClass}">
                            <span class="bias-indicator ${biasClass}"></span>
                            ${result.overallScore}/10
                        </div>
                        <div class="bias-tags">
                            ${biasesList}
                        </div>
                    </div>
                </div>
            `;
        }

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsSection = document.getElementById('resultsSection');
        const resultsList = document.getElementById('resultsList');
        const emptyState = document.getElementById('emptyState');
        const resultsStats = document.getElementById('resultsStats');

        function performSearch() {
            const query = searchInput.value.trim();

            if (!query) {
                resultsSection.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            resultsSection.style.display = 'block';
            emptyState.style.display = 'none';
            resultsList.innerHTML = '<div class="loading-dots"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>';
            resultsStats.textContent = 'Analyzing for bias...';

            setTimeout(() => {
                const html = sampleResults.map(createResultCard).join('');
                resultsList.innerHTML = html;
                resultsStats.textContent = `Results for "${query}" (${sampleResults.length} found)`;
            }, 1500);
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        searchInput.focus();
    </script>
</body>
</html>
