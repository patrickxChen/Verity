<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verity - Bias Detection Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #202124;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            border-bottom: 1px solid #dadce0;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 500;
            color: #4285f4;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #5f6368;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #202124;
        }

        /* Hero Section */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 40vh;
            padding: 2rem;
        }

        .hero h1 {
            font-size: 5rem;
            font-weight: 300;
            color: #202124;
            text-align: center;
            margin-bottom: 1.5rem;
            letter-spacing: -2px;
        }

        /* Search Box */
        .search-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        .search-box {
            width: 100%;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 24px;
            padding: 0.75rem 1rem;
            transition: box-shadow 0.2s;
        }

        .search-box:hover {
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.08);
        }

        .search-box:focus-within {
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
            border-color: transparent;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1rem;
            color: #202124;
        }

        .search-box input::placeholder {
            color: #9aa0a6;
        }

        .search-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #4285f4;
            font-size: 1.2rem;
            padding: 0 0.5rem;
            transition: color 0.2s;
        }

        .search-btn:hover {
            color: #1f71e8;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            background: #f8f9fa;
            color: #3c4043;
            border: 1px solid #dadce0;
            padding: 0.75rem 2rem;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #f8f9fa;
            border-color: #c6c6c6;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
        }

        /* Results Section */
        .results-section {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: none;
        }

        .results-stats {
            color: #70757a;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Result Card */
        .result-item {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .result-domain {
            color: #006621;
            font-size: 0.85rem;
        }

        .result-title {
            color: #1f71e8;
            font-size: 1.2rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1.4;
        }

        .result-title:hover {
            color: #1551db;
            text-decoration: underline;
        }

        .result-snippet {
            color: #545454;
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 600px;
        }

        /* Bias Indicators */
        .bias-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.75rem;
            flex-wrap: wrap;
        }

        .bias-score {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
        }

        .bias-score.low {
            background: #e6f4ea;
            color: #137333;
        }

        .bias-score.medium {
            background: #fef7e0;
            color: #f9ab00;
        }

        .bias-score.high {
            background: #fce8e6;
            color: #d33b27;
        }

        .bias-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .bias-indicator.low {
            background: #34a853;
        }

        .bias-indicator.medium {
            background: #fbbc04;
        }

        .bias-indicator.high {
            background: #ea4335;
        }

        .bias-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .bias-tag {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 3px;
            background: #f0f0f0;
            color: #5f6368;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #70757a;
            display: block;
        }

        .empty-state p {
            font-size: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .navbar {
                padding: 0.75rem 1rem;
                flex-direction: column;
                gap: 1rem;
            }

            .nav-links {
                gap: 1rem;
                font-size: 0.85rem;
            }

            .search-container {
                padding: 0 1rem;
            }

            .results-section {
                padding: 0 1rem;
            }

            .button-group {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
            }
        }

        /* Loading */
        .loading-dots {
            display: inline-flex;
            gap: 0.25rem;
        }

        .loading-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #5f6368;
            animation: bounce 1.4s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                opacity: 0.3;
            }
            30% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">Verity</div>
        <ul class="nav-links">
            <li><a href="#about">About</a></li>
            <li><a href="#help">Help</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Verity</h1>
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search anything to detect bias...">
                <button class="search-btn" id="searchBtn">🔍</button>
            </div>
            <div class="button-group">
                <button class="btn" id="searchBtn2">Detect Bias</button>
                <button class="btn">I'm Feeling Lucky</button>
            </div>
        </div>
    </div>

    <!-- Results Section -->
    <div class="results-section" id="resultsSection">
        <div class="results-stats" id="resultsStats"></div>
        <div class="results-list" id="resultsList"></div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
        <p>Search results with AI-powered bias detection</p>
    </div>

    <script>
        const sampleResults = [
            {
                domain: "sciencenews.com",
                title: "New Study: Electric Vehicles May Have Hidden Climate Costs",
                snippet: "Researchers examine the environmental impact of EV manufacturing. The study finds that while EVs are cleaner over their lifetime, production impacts are significant...",
                overallScore: 6,
                severity: "medium",
                biases: ["Climate Bias", "Scientific", "Emotional"]
            },
            {
                domain: "reuters.com",
                title: "Understanding Global Temperature Trends: What Science Shows",
                snippet: "A comprehensive review of peer-reviewed research confirms that global temperatures are rising due to human activities. Major scientific organizations worldwide agree on these findings...",
                overallScore: 2,
                severity: "low",
                biases: ["Scientific"]
            },
            {
                domain: "tech-watch.io",
                title: "Tesla's CEO Sparks Controversy With Latest Social Media Posts",
                snippet: "The CEO of the electric vehicle company continues to generate debate with provocative statements. Critics point to a pattern of controversial remarks affecting company reputation...",
                overallScore: 5,
                severity: "medium",
                biases: ["Corporate", "Emotional"]
            },
            {
                domain: "politicalanalysis.com",
                title: "Democrats' Climate Plan Branded 'Job Killer' by Opposition",
                snippet: "A new environmental policy proposal faces intense partisan criticism. One political party characterizes the plan as economically destructive, though analyses on actual job impacts vary...",
                overallScore: 7,
                severity: "high",
                biases: ["Political", "Emotional", "Confirmation Bias"]
            }
        ];

        function createResultCard(result) {
            const biasClass = result.severity;
            const biasesList = result.biases.map(b => `<span class="bias-tag">${b}</span>`).join('');

            return `
                <div class="result-item">
                    <div class="result-domain">${result.domain} › search</div>
                    <a class="result-title">${result.title}</a>
                    <div class="result-snippet">${result.snippet}</div>
                    <div class="bias-container">
                        <div class="bias-score ${biasClass}">
                            <span class="bias-indicator ${biasClass}"></span>
                            Bias Score: ${result.overallScore}/10
                        </div>
                        <div class="bias-tags">
                            ${biasesList}
                        </div>
                    </div>
                </div>
            `;
        }

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const searchBtn2 = document.getElementById('searchBtn2');
        const resultsSection = document.getElementById('resultsSection');
        const resultsList = document.getElementById('resultsList');
        const emptyState = document.getElementById('emptyState');
        const resultsStats = document.getElementById('resultsStats');

        function performSearch() {
            const query = searchInput.value.trim();

            if (!query) {
                resultsSection.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            resultsSection.style.display = 'block';
            emptyState.style.display = 'none';
            resultsList.innerHTML = '<div class="loading-dots"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>';
            resultsStats.textContent = 'Analyzing results for bias...';

            setTimeout(() => {
                const html = sampleResults.map(createResultCard).join('');
                resultsList.innerHTML = html;
                resultsStats.textContent = `About ${sampleResults.length} results (0.42 seconds)`;
            }, 1500);
        }

        searchBtn.addEventListener('click', performSearch);
        searchBtn2.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // Focus search on load
        searchInput.focus();
    </script>
</body>
</html>
