<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verity - Search Beyond the Obvious</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Paragone';
            src: url('/static/ParagoneFancyAestheticSerif-lx0O0.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f3c2e 0%, #1a5d4a 25%, #2a8f6f 50%, #1b5e48 75%, #0d2f26 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #ffffff;
            min-height: 100vh;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        /* Hero Section */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 70px);
            padding: 3rem 2rem;
            transition: all 0.3s ease;
        }

        .hero.compact {
            height: auto;
            padding: 1rem 2rem;
        }

        .hero h1 {
            font-family: 'Paragone', serif;
            font-size: 6rem;
            font-weight: 400;
            color: #ffffff;
            text-align: center;
            margin-bottom: 2.5rem;
            letter-spacing: 2px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .hero.compact h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        /* Search Box */
        .search-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
            position: relative;
        }

        .search-box-wrapper {
            width: 100%;
            position: relative;
        }

        .search-box {
            width: 100%;
            display: flex;
            gap: 0.75rem;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 1rem;
            transition: all 0.2s;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .search-box:hover {
            background: rgba(255, 255, 255, 1);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .search-box:focus-within {
            border-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1rem;
            color: #333333;
            font-family: inherit;
            font-weight: 500;
        }

        .search-box input::placeholder {
            color: #999999;
        }

        .search-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #ffffff;
            border: none;
            cursor: pointer;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.2s;
            font-family: inherit;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        /* Suggestions */
        .suggestions {
            position: absolute;
            top: calc(100% + 0.5rem);
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            z-index: 10;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .suggestions.active {
            display: block;
        }

        .suggestion-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(100, 100, 100, 0.1);
            font-size: 0.9rem;
            color: #333333;
            font-weight: 500;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: rgba(102, 126, 234, 0.1);
            color: #333333;
        }

        /* Results Section */
        .results-section {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 2rem;
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .results-header {
            margin-bottom: 1.5rem;
        }

        .results-header h2 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .results-meta {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
        }

        /* Progress Stream */
        .progress-stream {
            margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 1rem;
            backdrop-filter: blur(10px);
        }

        .progress-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .progress-item:last-child {
            margin-bottom: 0;
        }

        .progress-spinner {
            min-width: 16px;
            width: 16px;
            height: 16px;
            border: 2px solid #4d4d4d;
            border-top-color: #bb86fc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .progress-item.done .progress-spinner {
            animation: none;
            border: none;
            color: #10b981;
            font-size: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Evidence Map */
        .evidence-container {
            margin-top: 1rem;
        }

        .evidence-section {
            margin-bottom: 1.5rem;
        }

        .evidence-section h3 {
            font-size: 1rem;
            margin-bottom: 0.75rem;
            color: #ffffff;
            font-weight: 600;
        }

        .evidence-item {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        .source-title {
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.25rem;
        }

        .source-meta {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            margin-bottom: 0.25rem;
        }

        .source-snippet {
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.5;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .results-section {
                padding: 0 1rem;
            }

            .search-box {
                flex-wrap: wrap;
            }

            .search-btn {
                flex: 1;
            }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: rgba(255, 255, 255, 0.8);
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">Verity</div>
    </nav>

    <!-- Hero Section -->
    <div class="hero" id="heroSection">
        <h1>Verity</h1>
        <div class="search-container">
            <div class="search-box-wrapper">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search unbiasedly...">
                    <button class="search-btn" id="searchBtn">Search</button>
                </div>
                <div class="suggestions" id="suggestions"></div>
            </div>
        </div>
    </div>

    <!-- Results Section -->
    <div class="results-section" id="resultsSection">
        <div class="results-header">
            <h2 id="resultsTitle">Analyzing...</h2>
            <div class="results-meta" id="resultsMeta"></div>
        </div>

        <!-- Progress Stream -->
        <div class="progress-stream" id="progressStream"></div>

        <!-- Evidence Map -->
        <div class="evidence-container" id="evidenceContainer" style="display: none;">
            <div class="evidence-section" id="perspectivesSection"></div>
            <div class="evidence-section" id="missingSection"></div>
        </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
        <p>Search to find evidence beyond the obvious</p>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const heroSection = document.getElementById('heroSection');
        const resultsSection = document.getElementById('resultsSection');
        const progressStream = document.getElementById('progressStream');
        const emptyState = document.getElementById('emptyState');
        const resultsTitle = document.getElementById('resultsTitle');
        const resultsMeta = document.getElementById('resultsMeta');
        const perspectivesSection = document.getElementById('perspectivesSection');
        const missingSection = document.getElementById('missingSection');
        const evidenceContainer = document.getElementById('evidenceContainer');
        const suggestionsEl = document.getElementById('suggestions');

        const suggestions = [
            'are electric vehicles better for the environment',
            'is nuclear power safe',
            'what are the effects of climate change',
            'is artificial intelligence a threat to humanity',
            'what is the best diet for health',
            'are vaccines safe and effective'
        ];

        let progressItems = {};

        // Show suggestions
        searchInput.addEventListener('focus', () => {
            if (searchInput.value.length === 0) {
                displaySuggestions(suggestions);
            }
        });

        // Filter suggestions as user types
        searchInput.addEventListener('input', () => {
            const query = searchInput.value.toLowerCase();
            if (query.length === 0) {
                displaySuggestions(suggestions);
            } else {
                const filtered = suggestions.filter(s =>
                    s.toLowerCase().includes(query)
                );
                displaySuggestions(filtered);
            }
        });

        // Hide suggestions when clicking outside
        document.addEventListener('click', (e) => {
            if (e.target !== searchInput) {
                suggestionsEl.classList.remove('active');
            }
        });

        function displaySuggestions(items) {
            suggestionsEl.innerHTML = items.map(item =>
                `<div class="suggestion-item">${item}</div>`
            ).join('');
            suggestionsEl.classList.add('active');

            // Add click handlers
            document.querySelectorAll('.suggestion-item').forEach(item => {
                item.addEventListener('click', () => {
                    searchInput.value = item.textContent;
                    suggestionsEl.classList.remove('active');
                    performSearch();
                });
            });
        }

        function performSearch() {
            const query = searchInput.value.trim();

            if (!query) {
                resultsSection.classList.remove('active');
                emptyState.style.display = 'block';
                return;
            }

            // Hide suggestions
            suggestionsEl.classList.remove('active');

            // Make hero compact
            heroSection.classList.add('compact');

            // Hide empty state and show results
            emptyState.style.display = 'none';
            resultsSection.classList.add('active');
            progressStream.innerHTML = '';
            progressItems = {};

            resultsTitle.textContent = `Searching: "${query}"`;
            resultsMeta.textContent = 'Investigating across multiple sources...';

            // Connect to server-sent events
            const eventSource = new EventSource(`/api/search?q=${encodeURIComponent(query)}`);

            eventSource.addEventListener('status', (event) => {
                const data = JSON.parse(event.data);
                updateProgress(data);
            });

            eventSource.addEventListener('result', (event) => {
                const data = JSON.parse(event.data);
                displayResults(data);
            });

            eventSource.addEventListener('error_msg', (event) => {
                const error = event.data;
                resultsTitle.textContent = 'Error';
                resultsMeta.textContent = error;
                eventSource.close();
            });

            eventSource.addEventListener('done', () => {
                eventSource.close();
            });
        }

        function updateProgress(status) {
            const key = status.stage || status;

            if (!progressItems[key]) {
                const item = document.createElement('div');
                item.className = 'progress-item';
                item.id = `progress-${key}`;
                item.innerHTML = `
                    <div class="progress-spinner"></div>
                    <span>${status.message || key}</span>
                `;
                progressStream.appendChild(item);
                progressItems[key] = item;
            }

            if (status.complete) {
                progressItems[key].classList.add('done');
                progressItems[key].querySelector('.progress-spinner').innerHTML = '✓';
            }
        }

        function displayResults(data) {
            if (data.answer) {
                resultsTitle.textContent = data.answer;
            }

            if (data.perspectives) {
                perspectivesSection.innerHTML = '<h3>Perspectives</h3>';
                data.perspectives.forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'evidence-item';
                    item.innerHTML = `
                        <div class="source-title">${p.position || 'View'}</div>
                        <div class="source-meta">Supporting sources: ${p.count || 1}</div>
                        <div class="source-snippet">${p.summary || ''}</div>
                    `;
                    perspectivesSection.appendChild(item);
                });
                evidenceContainer.style.display = 'block';
            }

            if (data.missing) {
                missingSection.innerHTML = '<h3>Missing Evidence</h3>';
                data.missing.forEach(m => {
                    const item = document.createElement('div');
                    item.className = 'evidence-item';
                    item.innerHTML = `
                        <div class="source-title">${m.query}</div>
                        <div class="source-snippet">${m.reasoning || ''}</div>
                    `;
                    missingSection.appendChild(item);
                });
            }
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        searchInput.focus();
    </script>
</body>
</html>
